/* Layout: one dark reading room; the book centered, controls in a bottom bar */
:root{--bg:#24282c;--bar:#1a1d20;--btn:#363b41;--btn-hover:#474d54;--fg:#eceff1;--paper:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}

button{background:var(--btn);color:var(--fg);border:0;border-radius:8px;height:40px;min-width:44px;padding:0 14px;font-size:17px;cursor:pointer}
button:hover{background:var(--btn-hover)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#count{min-width:92px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}

  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pf=new St.PageFlip(document.getElementById('book'),{width:Math.floor(w),height:Math.floor(h),size:'fixed',showCover:true,usePortrait:true,maxShadowOpacity:0.5,mobileScrollSupport:false,flippingTime:reduce?1:700});
  pf.loadFromHTML(document.querySelectorAll('.page'));
  var count=document.getElementById('count');
  function upd(){var i=pf.getCurrentPageIndex();var two=pf.getOrientation()==='landscape'&&i>0&&i<N-1;count.textContent=(two?(i+1)+'–'+(i+2):(i+1))+' / '+N;}
  pf.on('flip',upd);upd();
  document.getElementById('prev').onclick=function(){pf.flipPrev();};
  document.getElementById('next').onclick=function(){pf.flipNext();};
  document.getElementById('first').onclick=function(){pf.turnToPage(0);upd();};
  document.getElementById('last').onclick=function(){pf.turnToPage(N-1);upd();};
  document.getElementById('fs').onclick=function(){try{if(!document.fullscreenElement){var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){});}else document.exitFullscreen();}catch(e){}};
  document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev();});
})();
</script>
</body>
</html>
